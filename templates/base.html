<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SentinelAI{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <nav class="border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <a href="{{ url_for('dashboard.index') }}" class="text-lg font-semibold tracking-tight">
      Sentinel<span class="text-emerald-400">AI</span>
    </a>
    <a href="{{ url_for('dashboard.target') }}"
       class="text-sm bg-emerald-500 text-slate-950 font-medium px-3 py-1.5 rounded-md hover:bg-emerald-400">
      New Assessment
    </a>
  </nav>

  <main class="px-6 py-8 max-w-5xl mx-auto">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
